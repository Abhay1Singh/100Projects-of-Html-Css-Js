<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sorting Visualizer</h1>
        <div class="controls">
            <button onclick="generateArray()">Generate New Array</button>
            <button onclick="startSort()">Start Sorting</button>
            <!-- <button onclick="stopSort()">Stop Sorting</button> -->
            <label for="algorithms">Choose Algorithm:</label>
            <select id="algorithms">
                <option value="bubble">Bubble Sort</option>
                <option value="insertion">Insertion Sort</option>
                <option value="selection">Selection Sort</option>
                <option value="merge">Merge Sort</option>
                <option value="quick">Quick Sort</option>
                <option value="heap">Heap Sort</option>
            </select>
            <label for="speed">Speed:</label>
            <input type="range" id="speed" min="10" max="500" value="100" step="10" onchange="adjustSpeed()"> 
            <span id="speed-value">100ms</span>
        </div>
        <div id="array-container"></div>
    </div>
    <script src="js/main.js"></script>
    <script src="js/bubbleSort.js"></script>
    <script src="js/insertionSort.js"></script>
    <script src="js/selectionSort.js"></script>
    <script src="js/mergeSort.js"></script>
    <script src="js/quickSort.js"></script>
    <script src="js/heapSort.js"></script>
</body>
</html>
